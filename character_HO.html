<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>キャラクターHO</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Sawarabi+Mincho&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #000000;
      color: #ffffff;
      font-family: 'Sawarabi Mincho', serif;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      user-select: none;
    }

    /* 1. ゲーム画面全体のフレーム（16:9比率） */
    .game-screen {
      width: min(96vw, 170vh);
      aspect-ratio: 16 / 9;
      max-height: 96vh;
      background: url('background/great_houl.png') center/cover no-repeat #050508;
      position: relative;
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.9);
      padding: 25px 35px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* 暗めのオーバーレイ */
    .game-screen::before {
      content: '';
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.45);
      z-index: 1;
    }

    /* 全要素を前面に配置 */
    .layer-front {
      position: relative;
      z-index: 2;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* --- 2. ヘッダーエリア --- */
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 50px;
      margin-bottom: 10px;
    }

    /* 左上：固定バッジ */
    .top-badge {
      background: linear-gradient(135deg, #2b3b70, #182245);
      color: #ffffff;
      padding: 6px 20px;
      font-size: 1rem;
      letter-spacing: 0.08em;
      clip-path: polygon(0 0, 90% 0, 100% 50%, 90% 100%, 0 100%);
      border-left: 3px solid #5a78d0;
      box-shadow: 2px 2px 8px rgba(0,0,0,0.6);
    }

    /* 中央：キャラ名タイトルリボン */
    .title-ribbon {
      padding: 8px 45px;
      font-size: 1.6rem;
      font-weight: bold;
      color: #ffffff;
      letter-spacing: 0.12em;
      text-shadow: 1px 1px 4px rgba(0,0,0,0.8);
      clip-path: polygon(8% 0, 92% 0, 100% 50%, 92% 100%, 8% 100%, 0 50%);
      transition: all 0.4s ease;
      text-align: center;
      margin: 0 auto;
    }

    /* 右上メニューボタン */
    .menu-btn {
      position: absolute !important;
      top: 15px !important;
      right: 15px !important;
      z-index: 1000;
      background: rgba(0, 0, 0, 0.6);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.4);
      padding: 8px 16px;
      font-size: 1rem;
      cursor: pointer;
    }

    .menu-btn:hover {
      background: #c93b3b;
      border-color: #c93b3b;
    }

    /* --- サイドメニュー用スタイル（menu.js用） --- */
    .menu-overlay {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background-color: rgba(0, 0, 0, 0.6);
      z-index: 1001; opacity: 0; visibility: hidden;
      transition: all 0.3s ease;
    }
    .menu-overlay.active { opacity: 1; visibility: visible; }
    .side-menu {
      position: fixed; top: 0; right: -300px;
      width: 250px; height: 100vh;
      background-color: rgba(15, 15, 18, 0.95);
      border-left: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: -5px 0 15px rgba(0, 0, 0, 0.5);
      z-index: 1002; transition: right 0.3s ease;
      padding: 40px 20px; box-sizing: border-box; text-align: left;
    }
    .side-menu.active { right: 0; }
    .side-menu h2 { color: #ffffff; font-size: 1.5rem; border-bottom: 1px solid #c93b3b; padding-bottom: 10px; margin-top: 0; }
    .side-menu ul { list-style: none; padding: 0; margin: 30px 0; }
    .side-menu li { margin-bottom: 20px; }
    .side-menu a { color: #e0e0e0; text-decoration: none; font-size: 1.1rem; display: block; }
    .side-menu a:hover { color: #e5eb72; }
    .side-menu .close-btn { width: 100%; margin-top: 20px; border: 1px solid rgba(255, 255, 255, 0.4); background: rgba(0, 0, 0, 0.6); color: #fff; padding: 8px; cursor: pointer; }

    /* --- 4. メインレイアウト（立ち絵 ＋ HO文章） --- */
    .content-body {
      flex: 1;
      display: flex;
      gap: 20px;
      align-items: center;
      overflow: hidden;
      margin-bottom: 10px;
    }

    /* 左側：キャラ立ち絵表示枠 */
    .chara-standing-wrapper {
      width: 28%;
      height: 100%;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      position: relative;
    }
    .chara-standing-img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 5px 15px rgba(0,0,0,0.7));
    }

    /* 右側：HO文章カード */
    .ho-card {
      flex: 1;
      height: 100%;
      border-radius: 16px;
      padding: 25px 30px;
      box-sizing: border-box;
      backdrop-filter: blur(8px);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.7);
      transition: all 0.4s ease;
      border: 2px solid rgba(255, 255, 255, 0.3);
      display: flex;
      flex-direction: column;
    }

    /* 文章スクロールエリア */
    .ho-text-scroll {
      flex: 1;
      overflow-y: auto;
      padding-right: 12px;
      font-size: 1.05rem;
      line-height: 2;
      letter-spacing: 0.05em;
      color: #f0f0f0;
      white-space: pre-wrap;
      text-align: left; /* ←★ここを追加（文字を左揃えにする） */
    }
    /* スクロールバー装飾 */
    .ho-text-scroll::-webkit-scrollbar { width: 6px; }
    .ho-text-scroll::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.1); border-radius: 3px; }
    .ho-text-scroll::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.4); border-radius: 3px; }

    /* --- 5. 下部操作バー --- */
    .bottom-controls {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 25px;
      height: 45px;
    }

    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 1rem;
      cursor: pointer;
      color: #e0e0e0;
      text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
    }
    .checkbox-label input[type="checkbox"] {
      width: 18px;
      height: 18px;
      cursor: pointer;
      accent-color: #ffffff;
    }

    .next-btn {
      background: rgba(0, 0, 0, 0.7);
      color: #ffffff;
      border: 2px solid #ffffff;
      padding: 8px 35px;
      font-size: 1.15rem;
      font-family: inherit;
      cursor: pointer;
      letter-spacing: 0.15em;
      transition: all 0.3s ease;
    }
    .next-btn:hover:not(:disabled) {
      background: #ffffff;
      color: #000000;
      box-shadow: 0 0 15px rgba(255, 255, 255, 0.6);
    }
    .next-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
      border-color: #888;
    }
  </style>
</head>

　最初に会場に入ってきたのはツバキ様とダリア殿、その後秋の代行者ダリア殿が定刻前に会場に入られた。ダリア殿は会場に入るや否や真っすぐツバキ様のもとへ向かった。そのまま順番に挨拶周りをされる。相変わらず真面目な方だ。

9：02
　定刻を過ぎたころ、ものすごい勢いで夏の代行者ヒマワリ様が会場に到着される。
ヒマワリ「セーフ？セーフだよね？」
スイレン「ちゃんと遅刻だ。早く謝れ。」
いつも通り遅刻し、定番の流れまで披露してくれた。

12：00～14：00
　昼休みに入り、私は会場を後にしようとする。すると。
ツバキ「みんなで一緒に食べない？4人とも揃う機会は一年で今日だけなんだし。」
ヒマワリ「さんせーい！」
ヒイラギ「別にかまわないよ。」
ダリア「せっかくだし、僕もお誘いに乗るとしようかな。」
ツバキ様の周りでは他の代行者の方々も楽しそうな顔をされる。この世にたった４人しかいない四季の代行者。良好な関係を気づいているようで何よりだ。私はその光景を横目に会場を後にする。私の目に映る春の代行者ツバキ様は年齢よりもしっかりした印象の代行者の中で唯一全員と親しい存在だ。しかし、春の里ではツバキ様を『呪われた子』と呼び、忌み嫌っているらしい。四季庁としても何度か注意喚起を促したが所詮は政府機関。代行者の一族に強く出ることはできず、大した改善は見られない。詳しい事情が分からぬこちらとしてもこれ以上どうすることもできない。どうか彼女が少しでも幸せな時間を過ごせることを祈る。

18：00～19：00
　会議は滞りなく終わり、定刻に終了した。ダリア殿とヒイラギ殿は会議終了後そのまま会場を離れたが、ツバキ様とヒマワリ様は二人でお話されているようだ。私はその姿を横目にそのまま２階の執務室へと向かった。
　執務室へ戻り、ヒジリと共にタケルの動向について報告を受ける。世界の人々を救うためにも代行者の力を使うべきと主張する改革派テロ組織のボス“タケル”。やつは私とヒジリ、そして冬の護衛官ミオの元級友であり、空間を転移する超能力を持つ。過去に共に死線を潜り、お互いの命を預けたこともある男だ。しかし、私たちは救えなかった。慎も、詩織も、先生も。あの日、世界に絶望した健は行方をくらました、再び我々の前に現れた時にはテロ組織の長として我々と敵対していた。なんとしてでもやつを捕まえる。それこそが俺に与えられた最後の使命だと確信している。

19：00～19：45
　報告を終え一度夕食を取るため本館の食堂へ向かう。食堂に入ると、入り口でヒイラギ殿とヒマワリ様と出会う。どうやら彼らも今から夕食のようだ。
ユウタ「おや、皆さまもこれからお食事ですかな。実はつい最近新メニューが出ましてね、ぜひ召し上がってください。」
ヒマワリ「ありがとうございます。」
なぜか２人と目が合わなかったが、2人ともすぐに新メニューを注文しに行った。お腹が空いていたのだろうか？
　私たちが席に着くとき、ちょうど食事終えたツバキ様とダリア殿が一足先に食堂を出た。視線を前に戻すと。ヒイラギ殿の顔が険しい。もしや新メニューが口に合わないのか？私は急いで新メニューを口に入れる。しかし、私にはいつも通りの味に感じた。
ユウタ「ヒイラギ殿？新メニューはお口に合いませんか？これでも職員には人気なのですが。」
私は本人に尋ねてみた。ところが、
ヒイラギ「問題ない。」
と、そっけなく返されてしまった。どうやらヒイラギ殿のお眼鏡には敵わなかったようだ。私は少しショックをうける。そんな私に気を使ってくれたのかヒマワリ様フォローしてくれる。
ヒマワリ「私は超おいしいと思いますよー。」
どうやら、食堂にもう少し力を入れる必要がありそうだ。

19：45～20：30
　食事を終え、明日の代行者様方の帰りがスムーズにいくよう、警備会社などへの根回しを済ませるために外出することにした。

20：45～22：00
　出先から戻ると、ちょうどダリア殿が外出されるタイミングだった。
ユウタ「ダリア様。こんな時間にどちらへ？」
ダリア「少し街を見て見たくてな、2時間ほどブラブラしてみようかと。」
ユウタ「左様でしたか、どうぞお気をつけて。」
少し急いでいるのか、何やら運転手がかなり焦っているように見えた。
　ダリア殿を見送るとヒマワリ様が出てくる。
ユウタ「おや？ヒマワリ様も外出ですかな？」
ヒマワリ「いえいえー、ちょっと外の空気吸いたくなっちゃって。」
ユウタ「今時期は冷えますからね、お体にお気を付けください。」
ヒマワリ「お気遣いありがとうございます。」
ヒマワリ様を見送り、自室へ戻る。今日の会議で決まった施策の施工準備や、今後の管理スケジュールなど、やることはごまんとある。早く後継を育てて事務仕事は引退したいものだ。

22：00～22：10
　自室で仕事を片付けていると一階から轟音が聞こえる。直後、警報が四季庁に鳴り響く。私はすぐに警備に確認と報告を急がせる、何やら胸騒ぎがする。
　自室で待つ私のもとにヒジリがやってくる。
ヒジリ「今、確認してきた。どうやら別館一回の対客室で爆発があったらしい。火災の心配はない。なぜなら対客室は今氷漬けだからな。」
ユウタ「ヒイラギ殿が鎮火してくれたのか？」
ヒジリ「詳しいことは分からないが、どうやらそんな様子ではなかった。今詳しく調べさせてるところだ。」
ユウタ「しかし、ヒイラギ殿意外に対客室を凍らせることなどできないのではないか？」
私は疑問を抱えながら、報告を待つ。

22：15～
　報告を待つ私のもとに報告が上がる。そして、私の嫌な予感は的中してしまう。
警備員Ａ「報告です。爆発は対客室内部から、火器仕様の痕跡はなく、監視カメラは凍結の影響で完全に故障していました。おそらく内部から爆発と同時に凍り付いたものと推測されます。それから・・・。」
ユウタ「なんだ？」
警備員Ａ「いえ、まだ確証はないのですが、春の代行者ツバキ様の行方が分かっておらず、おそらく誘拐されたものと思われます。」
ユウタ「なんだと！？」
警備員「念のため、外の監視カメラを確認したところ、爆発の少し後に不審な車両が地下駐車場から出ていくところが確認されました。」
ユウタ「警備班の半数はすぐに痕跡を終え。残りは内部の被害状況の確認と、代行者様方の保護を優先しろ。」
状況は最悪だった。まさかこの四季庁で誘拐事件が起こるなど前代未聞である。しかし、なにかひっかかる。この事件はそう単純ではない気がした。

　その後、四季庁は総力を挙げツバキ様の行方を捜索したが、その行方を見つけることはは叶わず、この国から春が失われた。
