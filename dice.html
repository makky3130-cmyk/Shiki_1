<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>サイコロパート | 春夏秋冬〜追憶〜</title>
  <style>
    body {
      background-color: #050507;
      color: #e0e0e0;
      font-family: 'Sawarabi Mincho', serif;
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .game-screen {
      width: min(90vw, 160vh);
      aspect-ratio: 16 / 9;
      max-height: 90vh;
      background-color: #0f0f12;
      background-image: url('background/great_houl.png');
      background-size: cover;
      background-position: center;
      position: relative;
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 20px;
      overflow: hidden;
    }

    /* 左上：1つ前に戻るボタン */
    .back-btn {
      position: absolute;
      top: 80px;
      left: 20px;
      background: rgba(0, 0, 0, 0.6);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.6);
      padding: 8px 24px;
      font-size: 1.1rem;
      cursor: pointer;
      transition: all 0.3s ease;
      z-index: 10;
    }

    .back-btn:hover {
      background: #c93b3b;
      border-color: #c93b3b;
    }

    /* 上部：サイコロを振るボタン */
    .dice-btn {
      margin-top: 25px;
      background: #ffffff;
      color: #000000;
      font-size: 2rem;
      font-weight: bold;
      padding: 12px 60px;
      clip-path: polygon(20px 0%, calc(100% - 20px) 0%, 100% 50%, calc(100% - 20px) 100%, 20px 100%, 0% 50%);
      border: none;
      cursor: pointer;
      transition: transform 0.2s ease, background-color 0.2s ease;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      z-index: 10;
    }

    .dice-btn:hover {
      background: #e5eb72;
      transform: scale(1.05);
    }

    .dice-btn:disabled {
      background: #888;
      cursor: not-allowed;
      transform: none;
    }

    /* 中央：3Dサイコロコンテナ */
    .dice-container {
      width: 40%;
      height: 45%;
      background: rgba(0, 0, 0, 0.65);
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
      perspective: 800px; /* 立体奥行き感 */
    }

    /* 3D立方体本体 */
    .cube {
      width: 100px;
      height: 100px;
      position: relative;
      transform-style: preserve-3d;
      transform: rotateX(-25deg) rotateY(-35deg);
      transition: transform 1.5s cubic-bezier(0.25, 1, 0.5, 1);
    }

    /* 各面共通スタイル */
    .face {
      position: absolute;
      width: 100px;
      height: 100px;
      background: radial-gradient(circle at 30% 30%, #8b0000, #2b0000 70%, #000000 100%);
      border: 1px solid rgba(255, 215, 0, 0.3);
      border-radius: 16px;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
      display: grid;
      grid-template: repeat(3, 1fr) / repeat(3, 1fr);
      padding: 10px;
      box-sizing: border-box;
      align-items: center;
      justify-items: center;
    }

    /* 金の「目」のスタイル */
    .pip {
      width: 18px;
      height: 18px;
      background: radial-gradient(circle at 35% 35%, #fff6a1, #ffd700 60%, #b8860b 100%);
      border-radius: 50%;
      box-shadow: inset 1px 1px 3px rgba(255,255,255,0.8), 1px 2px 4px rgba(0,0,0,0.6);
    }

    /* 6つの面の位置合わせ (立方体化) */
    .face1 { transform: translateZ(50px); }
    .face6 { transform: rotateY(180deg) translateZ(50px); }
    .face2 { transform: rotateY(-90deg) translateZ(50px); }
    .face5 { transform: rotateY(90deg) translateZ(50px); }
    .face3 { transform: rotateX(90deg) translateZ(50px); }
    .face4 { transform: rotateX(-90deg) translateZ(50px); }

    /* 各面の目の配置指定 */
    /* 1の目 */
    .face1 .pip { grid-area: 2 / 2; width: 26px; height: 26px; }

    /* 2の目 */
    .face2 .pip:nth-child(1) { grid-area: 1 / 1; }
    .face2 .pip:nth-child(2) { grid-area: 3 / 3; }

    /* 3の目 */
    .face3 .pip:nth-child(1) { grid-area: 1 / 1; }
    .face3 .pip:nth-child(2) { grid-area: 2 / 2; }
    .face3 .pip:nth-child(3) { grid-area: 3 / 3; }

    /* 4の目 */
    .face4 .pip:nth-child(1) { grid-area: 1 / 1; }
    .face4 .pip:nth-child(2) { grid-area: 1 / 3; }
    .face4 .pip:nth-child(3) { grid-area: 3 / 1; }
    .face4 .pip:nth-child(4) { grid-area: 3 / 3; }

    /* 5の目 */
    .face5 .pip:nth-child(1) { grid-area: 1 / 1; }
    .face5 .pip:nth-child(2) { grid-area: 1 / 3; }
    .face5 .pip:nth-child(3) { grid-area: 2 / 2; }
    .face5 .pip:nth-child(4) { grid-area: 3 / 1; }
    .face5 .pip:nth-child(5) { grid-area: 3 / 3; }

    /* 6の目 */
    .face6 .pip:nth-child(1) { grid-area: 1 / 1; }
    .face6 .pip:nth-child(2) { grid-area: 1 / 3; }
    .face6 .pip:nth-child(3) { grid-area: 2 / 1; }
    .face6 .pip:nth-child(4) { grid-area: 2 / 3; }
    .face6 .pip:nth-child(5) { grid-area: 3 / 1; }
    .face6 .pip:nth-child(6) { grid-area: 3 / 3; }


    /* 下部：説明テキストボックス */
    .message-box {
      width: 100%;
      background: rgba(0, 0, 0, 0.85);
      border-top: 1px solid rgba(255, 255, 255, 0.2);
      padding: 20px 30px;
      box-sizing: border-box;
      text-align: left;
    }

    .message-text {
      font-size: 1.3rem;
      line-height: 1.6;
      color: #ffffff;
      margin: 0;
    }

    /* 出目表示ポップアップ */
    .result-overlay {
      display: none;
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.7);
      z-index: 100;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .result-box {
      background: #151518;
      border: 2px solid #c93b3b;
      padding: 30px 50px;
      border-radius: 10px;
      text-align: center;
    }

    .header-bar {
      position: absolute;
      top: 10px;
      left: 0px;
      right: 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 50px;
      z-index: 10;
    }

    /* 左上：固定バッジ */
    .top-badge {
      background: linear-gradient(135deg, #2b3b70, #182245);
      color: #ffffff;
      padding: 6px 20px;
      font-size: 1rem;
      letter-spacing: 0.08em;
      clip-path: polygon(0 0, 90% 0, 100% 50%, 90% 100%, 0 100%);
      border-left: 3px solid #5a78d0;
      box-shadow: 2px 2px 8px rgba(0,0,0,0.6);
    }
    
    /* 右上メニューボタン */
    .menu-btn {
      position: absolute !important;
      top: 15px !important;
      right: 15px !important;
      z-index: 1000;
      background: rgba(0, 0, 0, 0.6);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.4);
      padding: 8px 16px;
      font-size: 1rem;
      cursor: pointer;
    }

    .menu-btn:hover {
      background: #c93b3b;
      border-color: #c93b3b;
    }

    /* --- サイドメニュー用スタイル（menu.js用） --- */
    .menu-overlay {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background-color: rgba(0, 0, 0, 0.6);
      z-index: 1001; opacity: 0; visibility: hidden;
      transition: all 0.3s ease;
    }
    .menu-overlay.active { opacity: 1; visibility: visible; }
    .side-menu {
      position: fixed; top: 0; right: -300px;
      width: 250px; height: 100vh;
      background-color: rgba(15, 15, 18, 0.95);
      border-left: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: -5px 0 15px rgba(0, 0, 0, 0.5);
      z-index: 1002; transition: right 0.3s ease;
      padding: 40px 20px; box-sizing: border-box; text-align: left;
    }
    .side-menu.active { right: 0; }
    .side-menu h2 { color: #ffffff; font-size: 1.5rem; border-bottom: 1px solid #c93b3b; padding-bottom: 10px; margin-top: 0; }
    .side-menu ul { list-style: none; padding: 0; margin: 30px 0; }
    .side-menu li { margin-bottom: 20px; }
    .side-menu a { color: #e0e0e0; text-decoration: none; font-size: 1.1rem; display: block; }
    .side-menu a:hover { color: #e5eb72; }
    .side-menu .close-btn { width: 100%; margin-top: 20px; border: 1px solid rgba(255, 255, 255, 0.4); background: rgba(0, 0, 0, 0.6); color: #fff; padding: 8px; cursor: pointer; }
  </style>
</head>
<body>

  <div class="game-screen" id="gameScreen">
    
    <div class="header-bar">
      <div class="top-badge">4. ダイスフェーズ</div>
    </div>

    <button class="back-btn" onclick="goBack()">1つ前に戻る</button>

    <button class="dice-btn" id="rollBtn" onclick="rollDice()">サイコロを振る</button>

    <!-- 3Dサイコロを表示する領域 -->
    <div class="dice-container">
      <div class="cube" id="cube">
        <!-- 1の面 -->
        <div class="face face1"><span class="pip"></span></div>
        <!-- 2の面 -->
        <div class="face face2"><span class="pip"></span><span class="pip"></span></div>
        <!-- 3の面 -->
        <div class="face face3"><span class="pip"></span><span class="pip"></span><span class="pip"></span></div>
        <!-- 4の面 -->
        <div class="face face4"><span class="pip"></span><span class="pip"></span><span class="pip"></span><span class="pip"></span></div>
        <!-- 5の面 -->
        <div class="face face5"><span class="pip"></span><span class="pip"></span><span class="pip"></span><span class="pip"></span><span class="pip"></span></div>
        <!-- 6の面 -->
        <div class="face face6"><span class="pip"></span><span class="pip"></span><span class="pip"></span><span class="pip"></span><span class="pip"></span><span class="pip"></span></div>
      </div>
    </div>

    <div class="message-box">
      <p class="message-text">サイコロを振って数字の大きい人から順にキャラクターを選択することができます。</p>
    </div>

    <!-- 結果ダイアログ -->
    <div class="result-overlay" id="resultOverlay">
      <div class="result-box">
        <h2 style="font-size: 2rem; margin-top: 0;">出目: <span id="diceResultNum" style="color: #e5eb72;">6</span></h2>
        <p style="font-size: 1.2rem;">キャラクター選択画面へ進みます。</p>
        <button class="back-btn" style="position: static; margin-top: 15px;" onclick="goToSelect()">次へ進む</button>
      </div>
    </div>
  </div>

  <script>
    function goBack() {
      location.href = "chara_intro.html";
    }

    // 各出目に対応する3D回転角度の定義
    const faceRotations = {
      1: { x: 0,    y: 0 },
      2: { x: 0,    y: 90 },
      3: { x: -90,  y: 0 },
      4: { x: 90,   y: 0 },
      5: { x: 0,    y: -90 },
      6: { x: 0,    y: 180 }
    };

    function rollDice() {
      const cube = document.getElementById('cube');
      const rollBtn = document.getElementById('rollBtn');
      
      rollBtn.disabled = true;

      // 1〜6のランダムな数字
      const result = Math.floor(Math.random() * 6) + 1;
      const targetRotation = faceRotations[result];

      // グルグル回転させるためのランダムな回転数を加算 (3〜5回転)
      const extraSpinsX = (Math.floor(Math.random() * 3) + 3) * 360;
      const extraSpinsY = (Math.floor(Math.random() * 3) + 3) * 360;

      const finalRotateX = targetRotation.x + extraSpinsX;
      const finalRotateY = targetRotation.y + extraSpinsY;

      // 立体回転アニメーションの実行
      cube.style.transform = `rotateX(${finalRotateX}deg) rotateY(${finalRotateY}deg)`;

      // アニメーション終了（1.5秒後）に結果ポップアップを表示
      setTimeout(() => {
        document.getElementById('diceResultNum').innerText = result;
        document.getElementById('resultOverlay').style.display = 'flex';
        rollBtn.disabled = false;
      }, 1500);
    }

    function goToSelect() {
      location.href = "chara_select.html";
    }
  </script>
  <script src="menu.js"></script>
</body>
</html>
