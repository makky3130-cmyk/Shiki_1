<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>投票フェーズ | 春夏秋冬〜追憶〜</title>
  <style>
    body {
      background-color: #050507;
      color: #e0e0e0;
      font-family: 'Sawarabi Mincho', serif;
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      user-select: none;
    }

    /* ゲーム画面全体のフレーム（16:9維持） */
    .game-screen {
      width: min(90vw, 160vh);
      aspect-ratio: 16 / 9;
      max-height: 90vh;
      background: url('background/great_houl.png') center/cover no-repeat #0f0f12;
      position: relative;
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-sizing: border-box;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    /* 上部ヘッダーバッジ */
    .header-bar {
      position: absolute;
      top: 15px;
      left: 25px;
      z-index: 10;
    }
    .top-badge {
      background: linear-gradient(135deg, #2b3b70, #182245);
      color: #ffffff;
      padding: 6px 20px;
      font-size: 1rem;
      letter-spacing: 0.08em;
      clip-path: polygon(0 0, 90% 0, 100% 50%, 90% 100%, 0 100%);
      border-left: 3px solid #5a78d0;
      box-shadow: 2px 2px 8px rgba(0,0,0,0.6);
    }

    /* ステップ1：アナウンス画面 */
    #announceStep {
      text-align: center;
      background: rgba(10, 10, 15, 0.9);
      padding: 40px 60px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 10px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      max-width: 700px;
    }
    #announceStep h2 {
      color: #ffe169;
      font-size: 1.8rem;
      margin-top: 0;
      margin-bottom: 20px;
    }
    #announceStep p {
      color: #ccc;
      font-size: 1.1rem;
      line-height: 1.8;
      margin-bottom: 30px;
    }

    /* ステップ2：キャラカード選択画面 */
    #selectStep {
      display: none;
      text-align: center;
      width: 90%;
      max-width: 1100px;
    }
    #selectStep h2 {
      color: #ffe169;
      font-size: 1.6rem;
      margin-bottom: 8px;
    }
    #selectStep p {
      color: #aaa;
      font-size: 1rem;
      margin-bottom: 25px;
    }

    /* キャラカードを並べるグリッド（5人分） */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 20px;
      margin-bottom: 30px;
    }

    /* キャラカード本体 */
    .chara-card {
      background: rgba(15, 15, 22, 0.85);
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 8px;
      overflow: hidden;
      cursor: pointer;
      transition: all 0.25s ease;
      box-shadow: 0 6px 15px rgba(0,0,0,0.6);
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .chara-card:hover {
      border-color: #ffe169;
      transform: translateY(-5px);
      box-shadow: 0 10px 25px rgba(255, 225, 105, 0.2);
    }
    /* 選択されたカードのデザイン */
    .chara-card.selected {
      border-color: #ffe169;
      background: linear-gradient(135deg, #1f2c52, #10162c);
      box-shadow: 0 0 25px rgba(255, 225, 105, 0.5);
      transform: translateY(-5px);
    }

    /* カード内の画像コンテナ */
    .card-img-box {
      width: 100%;
      aspect-ratio: 3 / 4; /* 縦長の立ち絵などが綺麗に収まる比率 */
      background: #111;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .card-img-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s ease;
    }
    .chara-card:hover .card-img-box img {
      transform: scale(1.05);
    }

    /* カード下の名前表示エリア */
    .card-name-box {
      padding: 12px 0;
      width: 100%;
      background: rgba(10, 10, 15, 0.95);
      border-top: 1px solid rgba(255, 255, 255, 0.15);
      text-align: center;
    }
    .chara-name {
      font-size: 1.15rem;
      color: #fff;
      font-weight: bold;
      letter-spacing: 0.05em;
    }
    .chara-card.selected .chara-name {
      color: #ffe169;
    }

    /* ボタン共通 */
    .action-btn {
      padding: 12px 40px;
      background: linear-gradient(135deg, #2b3b70, #182245);
      border: 2px solid #5a78d0;
      border-radius: 4px;
      color: #ffe169;
      font-size: 1.2rem;
      font-family: 'Sawarabi Mincho', serif;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 6px 20px rgba(0,0,0,0.7);
    }
    .action-btn:hover {
      background: rgba(255, 225, 105, 0.2);
      border-color: #ffe169;
      transform: translateY(-2px);
    }
    .action-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none !important;
    }

    /* 右上メニューボタン */
    .menu-btn {
      position: absolute !important;
      top: 15px !important;
      right: 15px !important;
      z-index: 1000;
      background: rgba(0, 0, 0, 0.6);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.4);
      padding: 8px 16px;
      font-size: 1rem;
      cursor: pointer;
    }

    .menu-btn:hover {
      background: #c93b3b;
      border-color: #c93b3b;
    }

    /* --- サイドメニュー用スタイル（menu.js用） --- */
    .menu-overlay {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background-color: rgba(0, 0, 0, 0.6);
      z-index: 1001; opacity: 0; visibility: hidden;
      transition: all 0.3s ease;
    }
    .menu-overlay.active { opacity: 1; visibility: visible; }
    .side-menu {
      position: fixed; top: 0; right: -300px;
      width: 250px; height: 100vh;
      background-color: rgba(15, 15, 18, 0.95);
      border-left: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: -5px 0 15px rgba(0, 0, 0, 0.5);
      z-index: 1002; transition: right 0.3s ease;
      padding: 40px 20px; box-sizing: border-box; text-align: left;
    }
    .side-menu.active { right: 0; }
    .side-menu h2 { color: #ffffff; font-size: 1.5rem; border-bottom: 1px solid #c93b3b; padding-bottom: 10px; margin-top: 0; }
    .side-menu ul { list-style: none; padding: 0; margin: 30px 0; }
    .side-menu li { margin-bottom: 20px; }
    .side-menu a { color: #e0e0e0; text-decoration: none; font-size: 1.1rem; display: block; }
    .side-menu a:hover { color: #e5eb72; }
    .side-menu .close-btn { width: 100%; margin-top: 20px; border: 1px solid rgba(255, 255, 255, 0.4); background: rgba(0, 0, 0, 0.6); color: #fff; padding: 8px; cursor: pointer; }

  </style>
</head>
<body>

  <div class="game-screen">
    <div class="header-bar">
      <div class="top-badge">15. 投票フェーズ</div>
    </div>

    <!-- 【ステップ1】GMからの投票アナウンス画面 -->
    <div id="announceStep">
      <h2>投票フェーズ</h2>
      <p>GMの指示に従って、グループチャットで犯人投票を行ってください。<br>投票がすべて終了したら、下のボタンを押して投票結果の選択へ進んでください。</p>
      <button class="action-btn" onclick="goToSelectStep()">投票終了・結果選択へ ▶</button>
    </div>

    <!-- 【ステップ2】キャラクターカード画像選択画面 -->
    <div id="selectStep">
      <h2>最多投票者（または結末）の選択</h2>
      <p>グループチャットで最も多くの票を集めた人物を選択してください。</p>

      <div class="cards-grid">
        <!-- ヒナギク -->
        <div class="chara-card" onclick="selectChara('hinagiku', this)">
          <div class="card-img-box">
            <img src="chara/icon_hinagiku.png" alt="ヒナギク">
          </div>
          <div class="card-name-box">
            <div class="chara-name">ヒナギク</div>
          </div>
        </div>

        <!-- ヒマワリ -->
        <div class="chara-card" onclick="selectChara('himawari', this)">
          <div class="card-img-box">
            <img src="chara/icon_himawari.png" alt="ヒマワリ">
          </div>
          <div class="card-name-box">
            <div class="chara-name">ヒマワリ</div>
          </div>
        </div>

        <!-- ダリア -->
        <div class="chara-card" onclick="selectChara('daria', this)">
          <div class="card-img-box">
            <img src="chara/icon_daria.png" alt="ダリア">
          </div>
          <div class="card-name-box">
            <div class="chara-name">ダリア</div>
          </div>
        </div>

        <!-- ヒイラギ -->
        <div class="chara-card" onclick="selectChara('hiragi', this)">
          <div class="card-img-box">
            <img src="chara/icon_hiragi.png" alt="ヒイラギ">
          </div>
          <div class="card-name-box">
            <div class="chara-name">ヒイラギ</div>
          </div>
        </div>

        <!-- ユウタ -->
        <div class="chara-card" onclick="selectChara('yuta', this)">
          <div class="card-img-box">
            <img src="chara/icon_yuta.png" alt="ユウタ">
          </div>
          <div class="card-name-box">
            <div class="chara-name">ユウタ</div>
          </div>
        </div>
      </div>

      <button id="toEndingBtn" class="action-btn" onclick="goToEnding()" disabled>エンドストーリーへ進む ▶</button>
    </div>

  </div>

  <script>
    let selectedCardId = null;

    // ステップ1からステップ2へ切り替え
    function goToSelectStep() {
      document.getElementById("announceStep").style.display = "none";
      document.getElementById("selectStep").style.display = "block";
    }

    // キャラカードがクリックされたとき
    function selectChara(charaId, cardElement) {
      selectedCardId = charaId;

      // すべてのカードから selected クラスを外す
      const cards = document.querySelectorAll(".chara-card");
      cards.forEach(card => card.classList.remove("selected"));

      // クリックされたカードに selected をつける
      cardElement.classList.add("selected");

      // 「エンドストーリーへ進む」ボタンを有効化
      document.getElementById("toEndingBtn").removeAttribute("disabled");
    }

    // エンドストーリーへ進むボタンが押されたとき
    function goToEnding() {
      if (!selectedCardId) return;

      // localStorageに endId として保存
      localStorage.setItem('endId', selectedCardId);

      // end_story.html へ遷移
      location.href = "end_story.html";
    }
  </script>

   <script src="menu.js"></script>

</body>
</html>
