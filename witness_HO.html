<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>証言獲得</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Sawarabi+Mincho&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #000000;
      color: #ffffff;
      font-family: 'Sawarabi Mincho', serif;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      user-select: none;
    }

    /* 1. ゲーム画面全体のフレーム（16:9比率） */
    .game-screen {
      width: min(96vw, 170vh);
      aspect-ratio: 16 / 9;
      max-height: 96vh;
      background: url('background/great_houl.png') center/cover no-repeat #050508;
      position: relative;
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.9);
      padding: 25px 35px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* 暗めのオーバーレイ */
    .game-screen::before {
      content: '';
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.45);
      z-index: 1;
    }

    /* 全要素を前面に配置 */
    .layer-front {
      position: relative;
      z-index: 2;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* --- 2. ヘッダーエリア --- */
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 50px;
      margin-bottom: 10px;
    }

    /* 左上：固定バッジ */
    .top-badge {
      background: linear-gradient(135deg, #2b3b70, #182245);
      color: #ffffff;
      padding: 6px 20px;
      font-size: 1rem;
      letter-spacing: 0.08em;
      clip-path: polygon(0 0, 90% 0, 100% 50%, 90% 100%, 0 100%);
      border-left: 3px solid #5a78d0;
      box-shadow: 2px 2px 8px rgba(0,0,0,0.6);
    }

    /* 中央：キャラ名タイトルリボン */
    .title-ribbon {
      padding: 8px 45px;
      font-size: 1.6rem;
      font-weight: bold;
      color: #ffffff;
      letter-spacing: 0.12em;
      text-shadow: 1px 1px 4px rgba(0,0,0,0.8);
      clip-path: polygon(8% 0, 92% 0, 100% 50%, 92% 100%, 8% 100%, 0 50%);
      transition: all 0.4s ease;
      text-align: center;
      margin: 0 auto;
    }

    /* 右上メニューボタン */
    .menu-btn {
      position: absolute !important;
      top: 15px !important;
      right: 15px !important;
      z-index: 1000;
      background: rgba(0, 0, 0, 0.6);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.4);
      padding: 8px 16px;
      font-size: 1rem;
      cursor: pointer;
    }

    .menu-btn:hover {
      background: #c93b3b;
      border-color: #c93b3b;
    }

    /* --- サイドメニュー用スタイル（menu.js用） --- */
    .menu-overlay {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background-color: rgba(0, 0, 0, 0.6);
      z-index: 1001; opacity: 0; visibility: hidden;
      transition: all 0.3s ease;
    }
    .menu-overlay.active { opacity: 1; visibility: visible; }
    .side-menu {
      position: fixed; top: 0; right: -300px;
      width: 250px; height: 100vh;
      background-color: rgba(15, 15, 18, 0.95);
      border-left: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: -5px 0 15px rgba(0, 0, 0, 0.5);
      z-index: 1002; transition: right 0.3s ease;
      padding: 40px 20px; box-sizing: border-box; text-align: left;
    }
    .side-menu.active { right: 0; }
    .side-menu h2 { color: #ffffff; font-size: 1.5rem; border-bottom: 1px solid #c93b3b; padding-bottom: 10px; margin-top: 0; }
    .side-menu ul { list-style: none; padding: 0; margin: 30px 0; }
    .side-menu li { margin-bottom: 20px; }
    .side-menu a { color: #e0e0e0; text-decoration: none; font-size: 1.1rem; display: block; }
    .side-menu a:hover { color: #e5eb72; }
    .side-menu .close-btn { width: 100%; margin-top: 20px; border: 1px solid rgba(255, 255, 255, 0.4); background: rgba(0, 0, 0, 0.6); color: #fff; padding: 8px; cursor: pointer; }

    /* --- 4. メインレイアウト（立ち絵 ＋ HO文章） --- */
    .content-body {
      flex: 1;
      display: flex;
      gap: 20px;
      align-items: center;
      overflow: hidden;
      margin-bottom: 10px;
    }

    /* 左側：キャラ立ち絵表示枠 */
    .chara-standing-wrapper {
      width: 28%;
      height: 100%;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      position: relative;
    }
    .chara-standing-img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 5px 15px rgba(0,0,0,0.7));
    }

    /* 右側：HO文章カード */
    .ho-card {
      flex: 1;
      height: 100%;
      border-radius: 16px;
      padding: 25px 30px;
      box-sizing: border-box;
      backdrop-filter: blur(8px);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.7);
      transition: all 0.4s ease;
      border: 2px solid rgba(255, 255, 255, 0.3);
      display: flex;
      flex-direction: column;
    }

    /* 文章スクロールエリア */
    .ho-text-scroll {
      flex: 1;
      overflow-y: auto;
      padding-right: 12px;
      font-size: 1.05rem;
      line-height: 2;
      letter-spacing: 0.05em;
      color: #f0f0f0;
      white-space: pre-wrap;
      text-align: left; /* ←★ここを追加（文字を左揃えにする） */
    }
    /* スクロールバー装飾 */
    .ho-text-scroll::-webkit-scrollbar { width: 6px; }
    .ho-text-scroll::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.1); border-radius: 3px; }
    .ho-text-scroll::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.4); border-radius: 3px; }

    /* --- 5. 下部操作バー --- */
    .bottom-controls {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 25px;
      height: 45px;
    }

    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 1rem;
      cursor: pointer;
      color: #e0e0e0;
      text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
    }
    .checkbox-label input[type="checkbox"] {
      width: 18px;
      height: 18px;
      cursor: pointer;
      accent-color: #ffffff;
    }

    .next-btn {
      background: rgba(0, 0, 0, 0.7);
      color: #ffffff;
      border: 2px solid #ffffff;
      padding: 8px 35px;
      font-size: 1.15rem;
      font-family: inherit;
      cursor: pointer;
      letter-spacing: 0.15em;
      transition: all 0.3s ease;
    }
    .next-btn:hover:not(:disabled) {
      background: #ffffff;
      color: #000000;
      box-shadow: 0 0 15px rgba(255, 255, 255, 0.6);
    }
    .next-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
      border-color: #888;
    }
  </style>
</head>
<body>

  <div class="game-screen">
    <div class="layer-front">
      
      <!-- ヘッダーエリア -->
      <div class="header-bar">
        <div class="top-badge">12. 証言確認</div>
        <div class="title-ribbon" id="titleRibbon"></div>
      </div>

      <!-- メインコンテンツ -->
      <div class="content-body">
        <!-- キャラ立ち絵 -->
        <div class="chara-standing-wrapper">
          <img src="" id="charaImg" class="chara-standing-img" alt="キャラ全身">
        </div>

        <!-- HOテキストボックス -->
        <div class="ho-card" id="hoCard">
          <div class="ho-text-scroll" id="hoContent">読み込み中...</div>
        </div>
      </div>

      <!-- 下部操作エリア -->
      <div class="bottom-controls">
        <label class="checkbox-label">
          <input type="checkbox" id="readCheck" onchange="toggleNextBtn()">
          証言を確認しました。
        </label>
        <button class="next-btn" id="nextBtn" disabled onclick="goNext()">次へ進む</button>
      </div>

    </div>

  </div>

 <script>
    // キャラクターごとのデータ設定（見出しと本文のセットに構造化）
    const sheetDataStore = {
      sakura: {
        name: "サクラ",
        themeColor: {
          ribbon: "linear-gradient(135deg, #a8586c, #6e3241)",
          cardBg: "rgba(70, 30, 42, 0.8)",
          cardBorder: "rgba(220, 150, 170, 0.5)",
          headingColor: "#ff9ebb"
        },
        img: "chara/sakura_normal.png",
        sections: [
          {
            heading: "【サクラの証言】",
            text: "ツバキ様から目を離したのは20：50頃に薬を買いに行った時からだ。"
          }
        ]
      },
      suiren: {
        name: "スイレン",
        themeColor: {
          ribbon: "linear-gradient(135deg, #b87333, #7a4516)",
          cardBg: "rgba(75, 45, 18, 0.8)",
          cardBorder: "rgba(230, 160, 90, 0.5)",
          headingColor: "#f4a261"
        },
        img: "chara/suiren_normal.png",
        sections: [
          {
            heading: "【スイレンの証言】",
            text: "あの日、冬の護衛官ミオから地下駐車場方面からは外れて問題ないと言われた。"
          }
        ]
      },
      rindo: {
        name: "リンドウ",
        themeColor: {
          ribbon: "linear-gradient(135deg, #6b2838, #3f101c)",
          cardBg: "rgba(50, 18, 26, 0.8)",
          cardBorder: "rgba(180, 80, 100, 0.5)",
          headingColor: "e06c75"
        },
        img: "chara/rindo_normal.png",
        sections: [
          {
            heading: "【リンドウの証言】",
            text: "警備主任だった先代が最後に残した言葉は「意図せず、梯子は外される」だった。"
          }
        ]
      },
      mio: {
        name: "ミオ",
        themeColor: {
          ribbon: "linear-gradient(135deg, #5c626b, #333840)",
          cardBg: "rgba(40, 44, 52, 0.8)",
          cardBorder: "rgba(160, 170, 185, 0.5)",
          headingColor: "79c0ff"
        },
        img: "chara/mio_normal.png",
        sections: [
          {
            heading: "【ミオの証言】",
            text: "爆発音の後、別館へ向かう人だかりとは反対に向かう警備員がいた。"
          }
        ]
      },
      hijiri: {
        name: "ヒジリ",
        themeColor: {
          ribbon: "linear-gradient(135deg, #4a5435, #262c19)",
          cardBg: "rgba(35, 42, 25, 0.8)",
          cardBorder: "rgba(140, 155, 110, 0.5)",
          headingColor: "#a3be8c"
        },
        img: "chara/hijiri_normal.png",
        sections: [
          {
            heading: "【ヒジリの証言】",
            text: "別館へのセキュリティゲートのログでは、入館者に対し退館者が1人足りていない。"
          }
        ]
      }
    };

    document.addEventListener("DOMContentLoaded", () => {
      // 1. 前の画面で保存されたキャラクターの名前（例: "サクラ"）を受け取る
      const selectedCharName = localStorage.getItem('selectedWitnessChar') || 'サクラ';

      // 2. 日本語の名前から、sheetDataStoreのキー（sakura, suiren等）を自動で見つける
      let selectedKey = 'sakura'; // デフォルト
      for (const key in sheetDataStore) {
        if (sheetDataStore[key].name === selectedCharName) {
          selectedKey = key;
          break;
        }
      }

      const data = sheetDataStore[selectedKey] || sheetDataStore['sakura'];

      // タイトルを「〇〇の証言・HO」などに動的に変更
      document.getElementById('titleRibbon').innerText = `${data.name}の証言`;

      // セクションごとに見出しと本文を組み立てて挿入
      const scrollContainer = document.getElementById('hoContent');
      scrollContainer.innerHTML = ""; 

      if (data.sections && Array.isArray(data.sections)) {
        data.sections.forEach(sec => {
          const h3 = document.createElement('h3');
          h3.innerText = sec.heading;
          h3.style.color = data.themeColor.headingColor || "#ffe169"; 
          h3.style.marginTop = "20px";
          h3.style.marginBottom = "8px";
          h3.style.fontSize = "1.2rem";
          
          if (scrollContainer.children.length === 0) {
            h3.style.marginTop = "0";
          }

          const p = document.createElement('p');
          p.innerText = sec.text;
          p.style.marginBottom = "25px";
          p.style.whiteSpace = "pre-wrap";

          scrollContainer.appendChild(h3);
          scrollContainer.appendChild(p);
        });
      }

      // デザインのカラーテーマや立ち絵画像をキャラごとに適用
      const ribbonElem = document.getElementById('titleRibbon');
      const cardElem = document.getElementById('hoCard');

      ribbonElem.style.background = data.themeColor.ribbon;
      cardElem.style.background = data.themeColor.cardBg;
      cardElem.style.borderColor = data.themeColor.cardBorder;

      const imgElem = document.getElementById('charaImg');
      imgElem.src = data.img;
      imgElem.onerror = () => {
        imgElem.src = `data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 400"><rect width="200" height="400" fill="%23222"/><text x="100" y="200" font-size="20" fill="%23fff" text-anchor="middle">${data.name}</text></svg>`;
      };
    });

    // チェックボックス
    function toggleNextBtn() {
      const isChecked = document.getElementById('readCheck').checked;
      document.getElementById('nextBtn').disabled = !isChecked;
    }

    // メニュー開閉
    function toggleMenu() {
      const sideMenu = document.getElementById('sideMenu');
      sideMenu.classList.toggle('active');
    }

    // メニュー項目クリック時の動作
    function menuAction(action) {
      if (action === 'title') {
        if (confirm("タイトル画面に戻りますか？")) {
          location.href = "title.html";
        }
      } else {
        alert(`${action} 機能は準備中です。`);
      }
    }

    // 次へ進む
    function goNext() {
      location.href = "second_meeting.html";
    }
  </script>

  <script src="menu.js"></script>

</body>
</html>
