<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>第一会議フェーズ | 春夏秋冬〜追憶〜</title>
  <style>
    body {
      background-color: #050507;
      color: #e0e0e0;
      font-family: 'Sawarabi Mincho', serif;
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      user-select: none;
    }

    /* 1. ゲーム画面全体のフレーム（16:9維持） */
    .game-screen {
      width: min(90vw, 160vh);
      aspect-ratio: 16 / 9;
      max-height: 90vh;
      background: url('background/great_houl.png') center/cover no-repeat #0f0f12;
      position: relative;
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-sizing: border-box;
      overflow: hidden;
    }

    .header-bar {
      position: absolute;
      top: 15px;
      left: 0px;
      right: 30px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start; /* ★上揃えにする */
      z-index: 10;
    }

    /* ★左側グループを縦並びにする設定 */
    .header-left-group {
      display: flex;
      flex-direction: column;
      gap: 6px; /* バッジとキャラ名の間の隙間 */
    }

    .top-badge {
      background: linear-gradient(135deg, #2b3b70, #182245);
      color: #ffffff;
      padding: 6px 20px;
      font-size: 1rem;
      letter-spacing: 0.08em;
      clip-path: polygon(0 0, 90% 0, 100% 50%, 90% 100%, 0 100%);
      border-left: 3px solid #5a78d0;
      box-shadow: 2px 2px 8px rgba(0,0,0,0.6);
      display: inline-block; /* 幅が文字分だけに収まるようにする */
    }

    .my-player-display {
      font-size: 1.05rem;
      color: #cccccc;
      text-shadow: 0 2px 5px rgba(0,0,0,0.9);
      margin-left: 2px; /* 少しだけ右にずらすと綺麗 */
    }

    /* 右上メニューボタン */
    .menu-btn {
      position: absolute !important;
      top: 15px !important;
      right: 15px !important;
      z-index: 1000;
      background: rgba(0, 0, 0, 0.6);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.4);
      padding: 8px 16px;
      font-size: 1rem;
      cursor: pointer;
    }

    .menu-btn:hover {
      background: #c93b3b;
      border-color: #c93b3b;
    }

    /* --- サイドメニュー用スタイル（menu.js用） --- */
    .menu-overlay {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background-color: rgba(0, 0, 0, 0.6);
      z-index: 1001; opacity: 0; visibility: hidden;
      transition: all 0.3s ease;
    }
    .menu-overlay.active { opacity: 1; visibility: visible; }
    .side-menu {
      position: fixed; top: 0; right: -300px;
      width: 250px; height: 100vh;
      background-color: rgba(15, 15, 18, 0.95);
      border-left: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: -5px 0 15px rgba(0, 0, 0, 0.5);
      z-index: 1002; transition: right 0.3s ease;
      padding: 40px 20px; box-sizing: border-box; text-align: left;
    }
    .side-menu.active { right: 0; }
    .side-menu h2 { color: #ffffff; font-size: 1.5rem; border-bottom: 1px solid #c93b3b; padding-bottom: 10px; margin-top: 0; }
    .side-menu ul { list-style: none; padding: 0; margin: 30px 0; }
    .side-menu li { margin-bottom: 20px; }
    .side-menu a { color: #e0e0e0; text-decoration: none; font-size: 1.1rem; display: block; }
    .side-menu a:hover { color: #e5eb72; }
    .side-menu .close-btn { width: 100%; margin-top: 20px; border: 1px solid rgba(255, 255, 255, 0.4); background: rgba(0, 0, 0, 0.6); color: #fff; padding: 8px; cursor: pointer; }

    /* 3. 中央上：キャラアイコン一覧 */
    .chara-icon-bar {
      position: absolute;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 18px;
      z-index: 10;
    }
    .chara-icon-wrapper {
      position: relative;
      cursor: pointer;
    }
    .chara-icon {
      width: 75px;
      height: 75px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.4);
      object-fit: cover;
      transition: all 0.25s ease;
      filter: brightness(0.65);
      transform: scale(0.95);
      background-color: #222;
    }
    .chara-icon-wrapper:hover .chara-icon {
      filter: brightness(0.9);
      transform: scale(1.02);
    }
    .chara-icon-wrapper.active .chara-icon {
      filter: brightness(1.1);
      transform: scale(1.15);
      border-color: #ffe169;
      box-shadow: 0 0 15px rgba(255, 225, 105, 0.6);
    }

    /* 4. 左下：3段縦並びツールボタン */
    .left-tools {
      position: absolute;
      bottom: 25px;
      left: 25px;
      display: flex;
      flex-direction: column;
      gap: 15px;
      z-index: 10;
    }
    .tool-btn {
      width: 65px;
      height: 65px;
      background: rgba(15, 15, 20, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 12px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }
    .tool-btn:hover {
      background: rgba(40, 40, 55, 0.9);
      border-color: #ffe169;
      transform: translateY(-2px);
    }
    .tool-btn img {
      width: 42px;
      height: 42px;
      object-fit: contain;
    }

    /* マップ画像用のスタイル */
    .tool-map-img {
      width: 100%;
      height: calc(100% - 30px); /* 枠の中にぴったり収める */
      max-height: 380px;         /* 大きくなりすぎないようにストップをかける */
      object-fit: contain;
      background: #000;
      border: 1px solid rgba(255,255,255,0.1);
      display: block;
      margin: 0 auto;
    }

    /* 5. メイン情報コンテンツエリア（左右並び） */
    .main-content-area {
      position: absolute;
      bottom: 25px;
      left: 110px;
      right: 25px;
      height: 68%;
      display: flex;
      gap: 20px;
      z-index: 10;
    }

    .info-panel {
      background: rgba(10, 10, 15, 0.88);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 10px;
      padding: 20px 25px;
      box-sizing: border-box;
      backdrop-filter: blur(5px);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.7);
    }

    /* ④ 中央下：情報公開パネル（ボタンが増えてもスクロールで綺麗に収まる設計） */
    .publish-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .panel-title {
      font-size: 1.4rem;
      margin-top: 5px;
      margin-bottom: 20px;
      letter-spacing: 0.05em;
      color: #f0f0f0;
      text-align: center;
    }
    .publish-btn-group {
      width: 85%;
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding-right: 5px;
    }
    .publish-btn-group::-webkit-scrollbar { width: 4px; }
    .publish-btn-group::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.3); border-radius: 2px; }

    .publish-btn {
      width: 100%;
      padding: 12px 0;
      background: transparent;
      border: 2px solid rgba(255, 255, 255, 0.7);
      color: #ffffff;
      font-size: 1.2rem;
      font-family: inherit;
      letter-spacing: 0.2em;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: center;
      flex-shrink: 0;
    }
    .publish-btn:hover:not(:disabled) {
      background: rgba(255, 255, 255, 0.15);
      border-color: #ffe169;
      color: #ffe169;
      box-shadow: 0 0 10px rgba(255, 225, 105, 0.3);
    }
    .publish-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
      border-color: rgba(255, 255, 255, 0.2);
    }

    /* ⑤ 右下：他キャラの公開情報表示パネル */
    .public-info-panel {
      flex: 1.2;
      display: flex;
      flex-direction: column;
    }
    .public-header {
      font-size: 1.3rem;
      border-bottom: 2px solid rgba(255, 255, 255, 0.5);
      padding-bottom: 10px;
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .target-speaker-name {
      font-weight: bold;
      color: #ff9ebb;
    }
    .public-list {
      overflow-y: auto;
      flex: 1;
      padding-right: 8px;
    }
    .public-list::-webkit-scrollbar { width: 6px; }
    .public-list::-webkit-scrollbar-track { background: rgba(255,255,255,0.05); }
    .public-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.3); border-radius: 3px; }

    .info-item {
      margin-bottom: 20px;
      padding: 10px;
      border-radius: 6px;
      background: rgba(255,255,255,0.02);
    }
    .info-item-title {
      font-size: 1.15rem;
      color: #ffffff;
      margin-bottom: 4px;
    }
    .info-item-body {
      font-size: 1rem;
      color: #cccccc;
      line-height: 1.6;
      white-space: pre-wrap;
    }
    .info-item-body.unreleased {
      color: #777777;
    }
    .unlock-hint {
      font-size: 0.85rem;
      color: #ffe169;
      cursor: pointer;
      text-decoration: underline;
    }

    /* --- ゲーム固有のモーダル（サブ選択やパスワード入力など）の初期非表示設定 --- */
    .modal-overlay {
      position: absolute !important;
      top: 0 !important;
      left: 0 !important;
      width: 100% !important;
      height: 100% !important;
      background: rgba(0, 0, 0, 0.75) !important;
      backdrop-filter: blur(4px);
      z-index: 10000 !important;
      display: flex !important;
      justify-content: center !important;
      align-items: center !important;
      opacity: 0 !important;
      visibility: hidden !important; /* 普段は隠しておく */
      pointer-events: none !important;
      transition: all 0.3s ease !important;
    }

    /* .active がついたときだけ表示する */
    .modal-overlay.active {
      opacity: 1 !important;
      visibility: visible !important;
      pointer-events: auto !important;
    }

    /* 右上の赤い×ボタン */
    .tool-red-close-btn {
      position: absolute;
      top: 15px;
      right: 20px;
      background: #c93b3b;
      border: none;
      color: #fff;
      width: 35px;
      height: 35px;
      border-radius: 50%;
      font-size: 1.2rem;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: all 0.2s ease;
      z-index: 10;
    }
    .tool-red-close-btn:hover {
      background: #ff5252;
      transform: scale(1.1);
      box-shadow: 0 0 10px rgba(255, 82, 82, 0.8);
    }

    .tool-modal-title {
      font-size: 1.4rem;
      color: #ffe169;
      border-bottom: 1px solid rgba(255, 255, 255, 0.2);
      padding-bottom: 12px;
      margin-top: 0;
      margin-right: 40px;
      letter-spacing: 0.05em;
    }

    .tool-modal-body {
      flex: 1;
      overflow: hidden;
      position: relative;
      margin-top: 15px;
      margin-bottom: 15px;
    }
    .tool-modal-body.scrollable {
      overflow-y: auto;
      padding-right: 10px;
    }
    .tool-modal-body::-webkit-scrollbar { width: 6px; }
    .tool-modal-body::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.3); border-radius: 3px; }

    /* ページ切り替えの制御用（最初は非表示） */
    .tool-page-content {
      display: none;
      height: 100%;
    }
    .tool-page-content.active-page {
      display: block; /* 選択されているページだけ表示 */
    }

    /* マップ画像用スタイル（サイズ拡大版） */
    .tool-map-img {
      width: 100%;
      height: 100%;       /* 枠の高さ目一杯まで広げる */
      max-height: 460px;  /* 以前より大きく表示（必要に応じて 450〜480px あたりで微調整できます） */
      object-fit: contain;
      background: #000;
      border: 1px solid rgba(255,255,255,0.1);
      display: block;
      margin: 0 auto;
    }

    /* 題名・本文のスタイル */
    .content-subtitle {
      font-size: 1.2rem;
      color: #ffffff;
      margin-top: 0;
      margin-bottom: 15px;
      border-left: 3px solid #ffe169;
      padding-left: 10px;
    }
    .content-text {
      font-size: 1.05rem;
      line-height: 0.9.;
      color: #cccccc;
      white-space: pre-wrap;
      margin: 0;
    }

    /* 下部のページめくりコントローラー */
    .tool-pager {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid rgba(255, 255, 255, 0.15);
      padding-top: 12px;
    }
    .pager-btn {
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.3);
      color: #fff;
      padding: 6px 20px;
      font-family: inherit;
      font-size: 0.95rem;
      cursor: pointer;
      border-radius: 4px;
      transition: all 0.2s ease;
    }
    .pager-btn:hover {
      background: #ffe169;
      color: #000;
      border-color: #ffe169;
    }
    .pager-indicator {
      font-size: 1rem;
      color: #aaa;
      font-family: monospace;
      letter-spacing: 0.1em;
    }

    /* サブ選択メニュー（確定情報1〜5を選ぶ画面）のスタイル */
    .sub-select-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-width: 450px;
      margin: 10px auto;
    }
    .sub-select-item-btn {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.3);
      color: #fff;
      padding: 14px 20px;
      font-size: 1.1rem;
      font-family: inherit;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.2s ease;
    }
    .sub-select-item-btn:hover {
      background: rgba(255,255,255,0.2);
      border-color: #ffe169;
      color: #ffe169;
    }

    /* パスワード入力パッド用スタイル */
    .password-pad {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      height: 100%;
    }
    .password-display-box {
      font-size: 1.8rem;
      font-family: monospace;
      letter-spacing: 0.5em;
      background: #000;
      border: 2px solid #ffe169;
      padding: 10px 30px;
      border-radius: 6px;
      color: #ffe169;
      min-width: 150px;
      text-align: center;
    }
    .num-grid {
      display: grid;
      grid-template-columns: repeat(3, 70px);
      gap: 12px;
    }
    .num-btn {
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.4);
      color: #fff;
      font-size: 1.4rem;
      padding: 15px 0;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.1s ease;
    }
    .num-btn:hover {
      background: #ffe169;
      color: #000;
      border-color: #ffe169;
    }

    /* システムメニュー専用スタイル */
    .menu-item-list {
      display: flex;
      flex-direction: column;
      gap: 15px;
      max-width: 400px;
      margin: 20px auto 0;
    }
    .menu-action-btn {
      padding: 12px 20px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #fff;
      font-size: 1.1rem;
      font-family: inherit;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: center;
    }
    .menu-action-btn:hover {
      background: rgba(255, 255, 255, 0.2);
      border-color: #ffe169;
      color: #ffe169;
    }
    .setting-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    /* 第一会議フェーズ用の次へ進むボタン */
    .next-phase-btn {
      position: absolute;
      top: 70px;
      background: rgba(0, 0, 0, 0.7);
      color: #ffffff;
      border: 2px solid #ffffff;
      padding: 8px 30px;
      font-size: 1.1rem;
      font-family: inherit;
      cursor: pointer;
      letter-spacing: 0.15em;
      transition: all 0.3s ease;
      z-index: 20; /* メニューボタンと被らないように手前に置く */
    }
    .next-phase-btn:hover {
      background: #ffffff;
      color: #000000;
      box-shadow: 0 0 15px rgba(255, 255, 255, 0.6);
    }

    /* モーダルの背景（画面全体を暗くする） */
    .tool-modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.7); /* 暗い背景 */
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999; /* 一番手前に表示する */
    }

    /* モーダルの箱本体 */
    .tool-modal-container {
      background-color: #1a1a1a; /* ダークな背景色 */
      border: 1px solid #444;
      border-radius: 8px;
      color: #fff;
      padding: 30px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }

    @keyframes pulse {
      0% { opacity: 0.6; }
      100% { opacity: 1; }
    }

    /* --- 新・ツールモーダル専用の完全非表示＆中央配置スタイル --- */
    .tool-modal-overlay {
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      background: rgba(0, 0, 0, 0.85) !important;
      backdrop-filter: blur(5px);
      z-index: 99999 !important;
      display: flex !important;
      justify-content: center !important;
      align-items: center !important;
      opacity: 0 !important;
      visibility: hidden !important; /* 普段は完全に隠す */
      pointer-events: none !important;
      transition: all 0.3s ease !important;
    }

    /* アイコンが押されて active がついた時だけ画面中央に現れる */
    .tool-modal-overlay.active {
      opacity: 1 !important;
      visibility: visible !important;
      pointer-events: auto !important;
    }

    .tool-modal-container {
      width: 75vw !important;
      height: 75vh !important;
      max-width: 900px !important;
      max-height: 650px !important;
      background: #0f0f15 !important;
      border: 2px solid rgba(255, 255, 255, 0.3) !important;
      border-radius: 10px !important;
      position: relative !important;
      padding: 30px !important;
      box-sizing: border-box !important;
      display: flex !important;
      flex-direction: column !important;
      box-shadow: 0 15px 40px rgba(0,0,0,0.9) !important;
      color: #e0e0e0 !important;
    }

    /* 右上の赤い×ボタンの固定 */
    .tool-red-close-btn {
      position: absolute !important;
      top: 15px !important;
      right: 20px !important;
      background: #c93b3b !important;
      border: none !important;
      color: #fff !important;
      width: 35px !important;
      height: 35px !important;
      border-radius: 50% !important;
      font-size: 1.2rem !important;
      font-weight: bold !important;
      cursor: pointer !important;
      display: flex !important;
      justify-content: center !important;
      align-items: center !important;
      z-index: 10 !important;
    }
  </style>
</head>
<body>

  <div class="game-screen" id="gameScreen">
    
    <div class="header-bar">
      <!-- ★左側に寄せたいものをまとめるグループ箱 -->
      <div class="header-left-group">
        <div class="top-badge">9. 第一会議フェーズ</div>
        <div class="my-player-display">
          操作キャラ：<span id="myPlayerName" style="color: #ffe169; font-weight: bold;">---</span>
        </div>
      </div>

      <button class="next-phase-btn" onclick="goNextPhase()"> 証人尋問へ進む</button>
    </div>

    <!-- ② 中央上：キャラアイコン一覧 -->
    <div class="chara-icon-bar" id="charaIconBar"></div>

    <!-- ④ ⑤ メインコンテンツエリア -->
    <div class="main-content-area">
      <!-- ④ 中央下：情報公開パネル -->
      <!-- ★ここにボタンを増やす（自由にコピペして追加できます） -->
      <div class="info-panel publish-panel">
        <div class="panel-title">何を公開しますか？</div>
        <div class="publish-btn-group">
          <button class="publish-btn" onclick="openSubSelectModal('確定情報')">確 定 情 報</button>
          <button class="publish-btn" onclick="openSubSelectModal('アイテム')">ア イ テ ム</button>
          <button class="publish-btn" onclick="openSubSelectModal('秘密')">秘 密</button>
          <!-- 証言はフェーズごとに有効化できます -->
          <button class="publish-btn" disabled title="証人尋問フェーズ以降で選択可能">証  言</button>
        </div>
      </div>

      <!-- ⑤ 右下：公開情報確認パネル -->
      <div class="info-panel public-info-panel">
        <div class="public-header">

        { id: "yuta_5", category: "確定情報", number: 5, title: "確定情報 5", content: "爆発の後不審な車が四季庁の地下駐車場から走り去った", password: "096", unlocked: false },
        { id: "yuta_6", category: "アイテム", number: 1, title: "アイテム", content: "当時の監視カメラ\n22:00に爆発が起こり、カメラは故障したようだ", password: "583", unlocked: false },
        { id: "yuta_7", category: "秘密", number: 1, title: "秘密", content: "【ユウタ専用】能力：『統括者権限』", password: "124", unlocked: false }
      ]
    };

    let activeCharaId = "hinagiku";
    let remainingSeconds = 1200; // 20分

    let currentTargetItem = null; 
    let currentInputPassword = "";

    document.addEventListener("DOMContentLoaded", () => {
      renderCharaIcons();
      
      const myId = localStorage.getItem('selectedChara') || "hinagiku";
      
      // ★ ここに「左上にキャラ名を表示する処理」を追加
      const myChar = characters.find(c => c.id === myId);
      if (myChar) {
        const nameElem = document.getElementById("myPlayerName");
        if (nameElem) {
          nameElem.innerText = myChar.name;
          nameElem.style.color = myChar.color; 
        }
      }

      selectChara(myId);
    });

    // --- キャラアイコン描画 ---
    function renderCharaIcons() {
      const container = document.getElementById("charaIconBar");
      container.innerHTML = "";

      characters.forEach(chara => {
        const wrapper = document.createElement("div");
        wrapper.className = `chara-icon-wrapper ${chara.id === activeCharaId ? 'active' : ''}`;
        wrapper.id = `icon-${chara.id}`;
        wrapper.onclick = () => selectChara(chara.id);

        const img = document.createElement("img");
        img.className = "chara-icon";
        img.src = chara.icon;
        img.alt = chara.name;
        img.onerror = () => {
          img.src = `data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="%23333"/><text x="50" y="55" font-size="30" fill="%23fff" text-anchor="middle" dominant-baseline="middle">${chara.name[0]}</text></svg>`;
        };

        wrapper.appendChild(img);
        container.appendChild(wrapper);
      });
    }

    // --- キャラ選択切り替え ---
    function selectChara(charaId) {
      activeCharaId = charaId;
      const targetChara = characters.find(c => c.id === charaId);

      document.querySelectorAll(".chara-icon-wrapper").forEach(el => el.classList.remove("active"));
      document.getElementById(`icon-${charaId}`).classList.add("active");

      const speakerNameElem = document.getElementById("targetSpeakerName");
      speakerNameElem.innerText = targetChara.name;
      speakerNameElem.style.color = targetChara.color;

      renderPublicList(charaId);
    }

    // --- 右下：情報リストの描画 ---
    function renderPublicList(charaId) {
      const listContainer = document.getElementById("publicList");
      listContainer.innerHTML = "";

      const infoList = publicInfoStore[charaId] || [];

      infoList.forEach((item, index) => {
        const itemDiv = document.createElement("div");
        itemDiv.className = "info-item";

        const titleDiv = document.createElement("div");
        titleDiv.className = "info-item-title";
        titleDiv.innerHTML = `<span>${item.title}</span>`;

        const bodyDiv = document.createElement("div");

        if (item.unlocked) {
          bodyDiv.className = "info-item-body";
          bodyDiv.innerText = item.content;
        } else {
          bodyDiv.className = "info-item-body unreleased";
          bodyDiv.innerHTML = `まだ公開されていません。<br><span class="unlock-hint" onclick="requestUnlock('${charaId}', ${index})">🔒 パスワードを入力して解除する</span>`;
        }

        itemDiv.appendChild(titleDiv);
        itemDiv.appendChild(bodyDiv);
        listContainer.appendChild(itemDiv);
      });
    }

    // --- ★追加：中央下のボタンを押したとき、そのカテゴリーの項目一覧（1〜5番など）を選ぶサブメニューを開く ---
    // --- 中央下のボタンを押したとき、そのカテゴリーの項目一覧（1〜5番など）を選ぶサブメニューを開く ---
    function openSubSelectModal(categoryName) {
      const myId = localStorage.getItem('selectedChara') || "hinagiku";
      const myInfoList = publicInfoStore[myId] || [];

      // 該当するカテゴリーのアイテムだけを抽出
      const filteredList = myInfoList.filter(item => item.category === categoryName);

      const subListContainer = document.getElementById("subSelectList");
      subListContainer.innerHTML = "";

      // タイトルを正しく書き換える修正
      const titleElem = document.getElementById("subSelectModalTitle");
      if (titleElem) {
        titleElem.innerText = `${categoryName} の公開選択`;
      }

      if (filteredList.length === 0) {
        subListContainer.innerHTML = `<p style="text-align:center; color:#888;">このカテゴリーには公開できる情報がありません。</p>`;
      } else {
        filteredList.forEach(item => {
          const btn = document.createElement("button");
          btn.className = "sub-select-item-btn";
          btn.innerHTML = `<span>${item.title}</span> <span style="font-size:0.9rem; color:#ffe169;">▶ コードを見る</span>`;
          btn.onclick = () => {
            closeModal('subSelectModal');
            showMyPublishCode(item);
          };
          subListContainer.appendChild(btn);
        });
      }

      openModal('subSelectModal');
    }

    // 自分の公開コードを表示する
    function showMyPublishCode(item) {
      document.getElementById("myPublishTitle").innerText = `${item.title} の公開パスワード`;
      // パスワードを読みやすくハイフンで区切る（例: 267 → 2-6-7）
      const formattedPw = item.password.split('').join('-');
      document.getElementById("mySecretCodeDisplay").innerText = formattedPw;
      openModal('myPublishModal');
    }

    // --- パスワード解除の要求（他プレイヤーの未公開情報を開くとき） ---
    function requestUnlock(charaId, itemIndex) {
      currentTargetItem = { charaId, itemIndex };
      currentInputPassword = "";
      document.getElementById("passwordInputDisplay").innerText = "---";
      openModal('passwordModal');
    }

    function inputNum(num) {
      if (currentInputPassword.length < 3) {
        currentInputPassword += num;
        document.getElementById("passwordInputDisplay").innerText = currentInputPassword;
      }
    }

    function clearPassword() {
      currentInputPassword = "";
      document.getElementById("passwordInputDisplay").innerText = "---";
    }

    function submitPassword() {
      if (!currentTargetItem) return;
      const targetData = publicInfoStore[currentTargetItem.charaId][currentTargetItem.itemIndex];

      if (currentInputPassword === targetData.password) {
        // 認証成功時も、味気ないalertならここにカスタム通知を出せます
        targetData.unlocked = true;
        localStorage.setItem('gamePublicInfo', JSON.stringify(publicInfoStore));

        closeModal('passwordModal');
        renderPublicList(currentTargetItem.charaId);
        
        // 成功メッセージ（必要なら）
        showCustomAlert("認証成功", "暗証番号が一致しました。\n情報が公開されました。");
      } else {
        // ★パスワード間違いのとき、標準alertの代わりにゲーム内ポップアップを出す！
        clearPassword();
        showCustomAlert("認証失敗", "パスワードが違います。\n正しい3桁のコードを入力してください。");
      }
    }

    // ★ゲーム内のおしゃれな通知を表示する専用関数
    function showCustomAlert(title, text) {
      document.getElementById("customAlertTitle").innerText = title;
      document.getElementById("customAlertText").innerText = text;
      openModal('customAlertModal');
    }

    // --- 自分の手帳（HO）を開く ---
    function openHandbook() {
      const myId = localStorage.getItem('selectedChara') || "hinagiku";
      const myChar = characters.find(c => c.id === myId);
      const myInfoList = publicInfoStore[myId] || [];
      
      let hoText = `【キャラクター：${myChar.name}】\n\n【所持している情報・コード一覧（自分用メモ）】\n`;
      myInfoList.forEach(item => {
        hoText += `・[${item.category}] ${item.title} → 暗証番号: 【 ${item.password} 】\n`;
      });

      document.getElementById("handbookTitle").innerText = `${myChar.name} の手帳 (HO・暗証番号控え)`;
      document.getElementById("handbookBody").innerText = hoText;
      openModal('handbookModal');
    }

    // --- タイマー機能 ---
    function startTimer() {
      updateTimerDisplay();
      const timerInterval = setInterval(() => {
        if (remainingSeconds > 0) {
          remainingSeconds--;
          updateTimerDisplay();
        } else {
          clearInterval(timerInterval);
          alert("第一会議の制限時間が終了しました！");
        }
      }, 1000);
    }

    function updateTimerDisplay() {
      const min = Math.floor(remainingSeconds / 60).toString().padStart(2, '0');
      const sec = (remainingSeconds % 60).toString().padStart(2, '0');
      document.getElementById("timerDisplay").innerHTML = `${min}:${sec} <span class="hourglass-icon">⏳</span>`;
    }

    // --- モーダル制御 ---
    function openModal(modalId) {
      document.getElementById(modalId).classList.add("active");
    }
    function closeModal(modalId) {
      document.getElementById(modalId).classList.remove("active");
    }

    // フルスクリーン切り替え
    function toggleFullScreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(err => {
          alert(`フルスクリーン表示エラー: ${err.message}`);
        });
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        }
      }
    }

    // --- 証人尋問へ進むボタンを押したとき ---
    function goNextPhase() {
      openModal('confirmModal'); // 他のモーダルと同じ共通の開く仕組みを使う
    }

    // --- 「いいえ」を押したとき ---
    function closeConfirmModal() {
      closeModal('confirmModal'); // 共通の閉じる仕組みを使う
    }

    // --- 「はい」を押したとき ---
    function executeNextPhase() {
      location.href = "daice2.html";
    }

  </script>

  <script src="icon.js"></script>
  <script src="menu.js"></script>
</body>
</html>
